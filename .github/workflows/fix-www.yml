name: Setup www redirect to apex
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get existing forwarding rules
        run: |
          curl -s -X POST https://api.porkbun.com/api/v3/domain/forwarding/get/f1cu.space \
            -H "Content-Type: application/json" \
            -d '{"apikey":"pk1_8f6ce37bb9f16b9585f6a8fc12bb18d6ca0b6acdb305f0cccc56b9b0fc75fc","secretapikey":"sk1_3bfb3aa9e89a8bbaab893b3fa7117242528410f05ae935e8ba202e655f504ff4"}' | tee forwarding.json
      - name: Delete existing www forwarding (if any)
        run: |
          for id in $(jq -r '.forwarding[]? | select(.subdomain=="www" or .subdomain=="") | .id // empty' forwarding.json 2>/dev/null); do
            echo "Deleting forward $id"
            curl -s -X POST "https://api.porkbun.com/api/v3/domain/forwarding/delete/f1cu.space/$id" \
              -H "Content-Type: application/json" \
              -d '{"apikey":"pk1_8f6ce37bb9f16b9585f6a8fc12bb18d6ca0b6acdb305f0cccc56b9b0fc75fc","secretapikey":"sk1_3bfb3aa9e89a8bbaab893b3fa7117242528410f05ae935e8ba202e655f504ff4"}'
          done
      - name: Create permanent redirect www -> f1cu.space
        run: |
          curl -s -X POST https://api.porkbun.com/api/v3/domain/forwarding/create/f1cu.space \
            -H "Content-Type: application/json" \
            -d '{"apikey":"pk1_8f6ce37bb9f16b9585f6a8fc12bb18d6ca0b6acdb305f0cccc56b9b0fc75fc","secretapikey":"sk1_3bfb3aa9e89a8bbaab893b3fa7117242528410f05ae935e8ba202e655f504ff4","subdomain":"www","location":"https://f1cu.space","type":"permanent","includePath":true,"wildcard":true}' | tee forward-create.json
      - name: Verify forwarding
        run: |
          curl -s -X POST https://api.porkbun.com/api/v3/domain/forwarding/get/f1cu.space \
            -H "Content-Type: application/json" \
            -d '{"apikey":"pk1_8f6ce37bb9f16b9585f6a8fc12bb18d6ca0b6acdb305f0cccc56b9b0fc75fc","secretapikey":"sk1_3bfb3aa9e89a8bbaab893b3fa7117242528410f05ae935e8ba202e655f504ff4"}'
      - name: Save debug output
        run: |
          cat forwarding.json forward-create.json > dns-debug-output.txt
      - name: Commit debug output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dns-debug-output.txt
          git commit -m "debug: save Porkbun forwarding API response" || echo "nothing to commit"
          git push || echo "nothing to push"
