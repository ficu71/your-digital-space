name: Fix www CNAME
on: [push, workflow_dispatch]
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Delete existing www CNAME (Porkbun parking)
        run: |
          RESP=$(curl -s -X POST https://api.porkbun.com/api/v3/dns/retrieve/f1cu.space \
            -H "Content-Type: application/json" \
            -d '{"apikey":"pk1_8f6ce37bb9f16b9585f6a8fc12bb18d6ca0b6acdb305f0cccc56b9b0fc75fc","secretapikey":"sk1_3bfb3aa9e89a8bbaab893b3fa7117242528410f05ae935e8ba202e655f504ff4"}')
          echo "$RESP"
          for id in $(echo "$RESP" | jq -r '.records[] | select(.type=="CNAME" and .name=="www") | .id'); do
            echo "Deleting www CNAME $id"
            curl -s -X POST "https://api.porkbun.com/api/v3/dns/delete/f1cu.space/$id" \
              -H "Content-Type: application/json" \
              -d '{"apikey":"pk1_8f6ce37bb9f16b9585f6a8fc12bb18d6ca0b6acdb305f0cccc56b9b0fc75fc","secretapikey":"sk1_3bfb3aa9e89a8bbaab893b3fa7117242528410f05ae935e8ba202e655f504ff4"}'
          done
      - name: Create www CNAME to GitHub Pages
        run: |
          curl -s -X POST https://api.porkbun.com/api/v3/dns/create/f1cu.space \
            -H "Content-Type: application/json" \
            -d '{"apikey":"pk1_8f6ce37bb9f16b9585f6a8fc12bb18d6ca0b6acdb305f0cccc56b9b0fc75fc","secretapikey":"sk1_3bfb3aa9e89a8bbaab893b3fa7117242528410f05ae935e8ba202e655f504ff4","type":"CNAME","name":"www","content":"ficu71.github.io","ttl":"600"}'
      - name: Verify final DNS
        run: |
          curl -s -X POST https://api.porkbun.com/api/v3/dns/retrieve/f1cu.space \
            -H "Content-Type: application/json" \
            -d '{"apikey":"pk1_8f6ce37bb9f16b9585f6a8fc12bb18d6ca0b6acdb305f0cccc56b9b0fc75fc","secretapikey":"sk1_3bfb3aa9e89a8bbaab893b3fa7117242528410f05ae935e8ba202e655f504ff4"}'
