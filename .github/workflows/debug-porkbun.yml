name: Debug Porkbun DNS
on: [push, workflow_dispatch]
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Get DNS records and save to file
        run: |
          curl -s -X POST https://api.porkbun.com/api/v3/dns/retrieve/f1cu.space \
            -H "Content-Type: application/json" \
            -d '{"apikey":"pk1_8f6ce37bb9f16b9585f6a8fc12bb18d6ca0b6acdb305f0cccc56b9b0fc75fc","secretapikey":"sk1_3bfb3aa9e89a8bbaab893b3fa7117242528410f05ae935e8ba202e655f504ff4"}' > dns-output.json
          cat dns-output.json
      - name: Get forwarding and save
        run: |
          curl -s -X POST https://api.porkbun.com/api/v3/domain/forwarding/get/f1cu.space \
            -H "Content-Type: application/json" \
            -d '{"apikey":"pk1_8f6ce37bb9f16b9585f6a8fc12bb18d6ca0b6acdb305f0cccc56b9b0fc75fc","secretapikey":"sk1_3bfb3aa9e89a8bbaab893b3fa7117242528410f05ae935e8ba202e655f504ff4"}' > forwarding-output.json
          cat forwarding-output.json
      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dns-debug
          path: |
            dns-output.json
            forwarding-output.json
      - name: Also commit the files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dns-output.json forwarding-output.json
          git commit -m "debug: save Porkbun API responses" || echo "nothing to commit"
          git push || echo "nothing to push"
